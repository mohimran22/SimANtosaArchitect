[supervisord]
nodaemon=true

[program:laravel-init]
directory=/var/www
command=/bin/sh -c "php artisan storage:link || true && php artisan config:clear && php artisan config:cache && php artisan view:clear"
autostart=true
autorestart=false
priority=1
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr